<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 뮤지컬메이커 | EAIM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.2.3/build/index.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fdfbf6;--gold:#b8862a;--gold2:#e0ac45;
  --purple:#7c3aed;--pink:#c778dd;--blue:#5DADE2;
  --green:#52c27a;--red:#e0453f;
  --text:#2d2438;--sub:#7a6f8a;
  --border:rgba(124,58,237,0.12);--card:#ffffff;
}
body{font-family:'Noto Serif KR',serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(124,58,237,0.06) 0%,transparent 50%),
  radial-gradient(ellipse at 80% 100%,rgba(93,173,226,0.06) 0%,transparent 50%);}
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.login-box{background:#fff;border:1px solid rgba(124,58,237,0.12);border-radius:20px;padding:36px 28px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(124,58,237,0.06);}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:700;color:var(--gold);text-align:center;margin-bottom:4px;}
.login-sub{font-size:0.68rem;color:var(--sub);text-align:center;letter-spacing:0.25em;margin-bottom:28px;}
.field-label{font-size:0.7rem;color:var(--sub);margin-bottom:6px;letter-spacing:.1em;}
.t-input{background:#faf8ff;border:1px solid rgba(124,58,237,0.15);color:var(--text);border-radius:10px;width:100%;padding:12px 14px;font-size:0.9rem;font-family:inherit;outline:none;transition:border-color .2s;margin-bottom:10px;}
.t-input:focus{border-color:var(--purple);}
.t-input::placeholder{color:rgba(45,36,56,0.28);}
.main-btn{background:linear-gradient(135deg,#d4a843,#e8a020);color:#000;border:none;border-radius:12px;font-weight:900;font-size:1rem;padding:15px;width:100%;cursor:pointer;transition:all .2s;font-family:inherit;margin-top:4px;}
.main-btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(201,150,46,0.3);}
.main-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.err-msg{font-size:.72rem;color:#c0392b;margin-bottom:8px;min-height:18px;}
.notice-box{background:rgba(224,69,63,0.06);border:1px solid rgba(224,69,63,0.2);border-radius:10px;padding:14px;text-align:center;margin-bottom:14px;}
.app-header{background:linear-gradient(180deg,#fff9ec 0%,#fff3d9 60%,#fff 100%);border-bottom:2px solid var(--gold);padding:14px 20px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.logo-t{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;color:var(--gold);}
.header-right{display:flex;align-items:center;gap:10px;}
.mode-badge{font-size:.6rem;padding:3px 10px;border-radius:10px;font-weight:700;letter-spacing:.1em;}
.badge-teacher{background:rgba(184,134,42,0.12);color:var(--gold);border:1px solid rgba(184,134,42,0.35);}
.badge-student{background:rgba(82,194,122,0.12);color:#2e7d4f;border:1px solid rgba(82,194,122,0.4);}
.logout-btn{font-size:.62rem;color:rgba(45,36,56,.4);background:none;border:none;cursor:pointer;}
.tab-bar{display:flex;background:rgba(124,58,237,0.03);border-bottom:1px solid rgba(124,58,237,.08);position:sticky;top:58px;z-index:90;}
.tab-btn{flex:1;padding:11px 4px;font-size:.78rem;font-weight:700;cursor:pointer;border:none;background:none;color:rgba(45,36,56,.4);font-family:inherit;transition:all .2s;border-bottom:2px solid transparent;}
.tab-btn.on{color:var(--gold);border-bottom-color:var(--gold);}
.badge-count{background:rgba(184,134,42,0.12);color:var(--gold);border-radius:8px;padding:1px 6px;font-size:.62rem;margin-left:4px;}
main{max-width:900px;margin:0 auto;padding:24px 16px 80px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(45,36,56,.04);}
.card-title{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:700;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.api-badge{display:flex;align-items:center;gap:8px;background:#faf8ff;border:1px solid rgba(184,134,42,0.2);border-radius:10px;padding:10px 14px;}
.api-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-on{background:var(--green);box-shadow:0 0 6px var(--green);}
.dot-off{background:rgba(45,36,56,.15);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#faf8ff;border-radius:10px;border:1px solid rgba(124,58,237,.08);}
.toggle-track{width:50px;height:26px;border-radius:13px;background:rgba(45,36,56,.12);position:relative;cursor:pointer;transition:background .3s;flex-shrink:0;}
.toggle-track.on{background:rgba(82,194,122,0.5);border:1px solid var(--green);}
.toggle-thumb{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(45,36,56,.2);position:absolute;top:3px;left:3px;transition:all .3s;}
.toggle-track.on .toggle-thumb{left:27px;background:var(--green);box-shadow:0 0 6px var(--green);}
.genre-step{background:#faf8ff;border:1px solid rgba(124,58,237,.08);border-radius:10px;padding:14px;margin-bottom:8px;}
.genre-step-lbl{font-size:.68rem;color:var(--sub);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.step-badge{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;}
.sb1{background:rgba(184,134,42,0.15);color:var(--gold);}
.sb2{background:rgba(199,120,221,0.18);color:#a83fb0;}
.genre-tags{display:flex;flex-wrap:wrap;gap:7px;}
.gtag{padding:7px 14px;border-radius:20px;cursor:pointer;font-size:.8rem;border:1px solid rgba(124,58,237,.12);background:#faf8ff;color:var(--sub);transition:all .2s;user-select:none;}
.gtag:hover{border-color:var(--gold);color:var(--gold);}
.gtag.on-bg{background:rgba(184,134,42,0.15);border-color:var(--gold);color:var(--gold);font-weight:700;}
.gtag.on-mood{background:rgba(199,120,221,0.18);border-color:#a83fb0;color:#a83fb0;font-weight:700;}
.genre-summary{display:none;align-items:center;gap:8px;margin-top:8px;padding:8px 12px;background:rgba(82,194,122,0.06);border:1px solid rgba(82,194,122,.2);border-radius:8px;font-size:.78rem;color:#2e7d4f;}
.genre-summary.show{display:flex;}
.counter-wrap{display:flex;align-items:center;gap:0;background:#faf8ff;border:1px solid rgba(124,58,237,.12);border-radius:10px;overflow:hidden;width:fit-content;}
.c-btn{width:44px;height:46px;border:none;cursor:pointer;background:transparent;color:var(--text);font-size:1.3rem;font-family:inherit;transition:background .2s;display:flex;align-items:center;justify-content:center;}
.c-btn:hover{background:rgba(184,134,42,0.12);color:var(--gold);}
.c-val{min-width:70px;text-align:center;font-size:1.6rem;font-weight:700;color:var(--gold);font-family:'Cormorant Garamond',serif;border-left:1px solid rgba(124,58,237,.1);border-right:1px solid rgba(124,58,237,.1);line-height:46px;}
.act-btns{display:flex;gap:8px;}
.act-btn{flex:1;padding:10px;border-radius:8px;cursor:pointer;text-align:center;font-size:.85rem;border:1px solid rgba(124,58,237,.12);background:#faf8ff;color:var(--sub);transition:all .2s;font-family:inherit;}
.act-btn.on{background:rgba(184,134,42,0.15);border-color:var(--gold);color:var(--gold);font-weight:700;}
.gen-btn{width:100%;padding:17px;border-radius:12px;cursor:pointer;border:none;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;letter-spacing:.05em;box-shadow:0 4px 20px rgba(124,58,237,0.25);transition:all .3s;margin-top:8px;}
.gen-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(124,58,237,0.35);}
.gen-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.prog-card{background:rgba(124,58,237,0.04);border:1px solid rgba(124,58,237,0.15);border-radius:14px;padding:28px;text-align:center;display:none;}
.prog-card.show{display:block;}
.prog-steps{display:flex;flex-direction:column;gap:10px;max-width:400px;margin:16px auto;}
.prog-step{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:8px;background:#faf8ff;font-size:.85rem;color:var(--sub);transition:all .4s;}
.prog-step.active{background:rgba(184,134,42,0.1);color:var(--gold);border:1px solid rgba(184,134,42,0.25);}
.prog-step.done{background:rgba(82,194,122,0.08);color:#2e7d4f;}
.sicon{font-size:1rem;width:22px;text-align:center;}
@keyframes spin{to{transform:rotate(360deg)}}
.result-wrap{display:none;}
.result-wrap.show{display:block;}
.r-header{text-align:center;padding:20px 0 16px;}
.r-title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:var(--gold);}
.r-sub{font-size:.75rem;color:var(--sub);letter-spacing:.15em;margin-top:6px;}
.scene-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(45,36,56,.04);}
.scene-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;transition:background .2s;border-bottom:1px solid transparent;}
.scene-header:hover{background:rgba(124,58,237,.03);}
.scene-header.open{border-bottom-color:rgba(124,58,237,.08);}
.scene-tag{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;padding:3px 10px;border-radius:10px;font-weight:700;}
.tag-opening{background:rgba(184,134,42,0.12);color:var(--gold);border:1px solid rgba(184,134,42,0.3);}
.tag-scene{background:rgba(93,173,226,0.12);color:#2f7ab8;border:1px solid rgba(93,173,226,0.3);}
.tag-curtain{background:rgba(199,120,221,0.12);color:#a83fb0;border:1px solid rgba(199,120,221,0.3);}
.scene-body{padding:18px;}
.edit-label{font-size:.68rem;color:var(--sub);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px;margin-top:14px;}
.edit-label:first-child{margin-top:0;}
.edit-box{background:#faf8ff;border:1px solid rgba(124,58,237,.12);border-radius:8px;padding:12px;color:var(--text);font-size:.88rem;font-family:'Noto Serif KR',serif;line-height:1.8;width:100%;outline:none;resize:vertical;transition:border-color .2s;min-height:80px;}
.edit-box:focus{border-color:var(--gold);}
.prompt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
@media(max-width:580px){.prompt-grid{grid-template-columns:1fr;}}
.prompt-box{background:#faf8ff;border:1px solid rgba(124,58,237,.10);border-radius:8px;padding:10px 12px;}
.prompt-label{font-size:.65rem;color:#a83fb0;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.prompt-text{font-size:.75rem;color:var(--sub);line-height:1.6;font-family:monospace;width:100%;background:none;border:none;outline:none;resize:none;}
.save-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(82,194,122,0.06);border:1px solid rgba(82,194,122,.2);border-radius:10px;margin-bottom:14px;font-size:.75rem;}
.save-status{display:flex;align-items:center;gap:6px;color:#2e7d4f;}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.btn-sec{padding:13px 18px;border-radius:10px;cursor:pointer;background:#faf8ff;border:1px solid rgba(124,58,237,.15);color:var(--sub);font-size:.88rem;font-family:inherit;transition:all .2s;}
.btn-sec:hover{background:rgba(124,58,237,.06);color:var(--text);}
.btn-regen{padding:13px 18px;border-radius:10px;cursor:pointer;background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.25);color:#a83fb0;font-size:.88rem;font-family:inherit;}
.btn-slide{flex:2;padding:15px;border-radius:10px;cursor:pointer;border:none;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:800;font-size:1rem;font-family:inherit;box-shadow:0 4px 20px rgba(199,120,221,0.25);}
.btn-dl{flex:1;padding:13px;border-radius:10px;cursor:pointer;border:none;background:linear-gradient(135deg,var(--blue),#2f6a9c);color:#fff;font-weight:700;font-size:.88rem;font-family:inherit;}
.work-card{background:#faf8ff;border:1px solid rgba(124,58,237,.10);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:border-color .2s;}
.work-card:hover{border-color:rgba(184,134,42,.3);}
.work-card.approved{border-left:3px solid var(--green);}
.w-title{font-weight:700;font-size:.95rem;color:var(--gold);}
.w-meta{font-size:.68rem;color:rgba(45,36,56,.4);margin-top:3px;}
.w-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
.w-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;font-size:.72rem;cursor:pointer;border:1px solid rgba(124,58,237,.12);background:#fff;color:rgba(45,36,56,.55);font-family:inherit;transition:all .2s;}
.w-btn:hover{background:rgba(124,58,237,.06);color:var(--text);}
.w-btn.approve-on{border-color:var(--green);color:#2e7d4f;}
.w-btn.danger{border-color:rgba(224,69,63,.3);color:#c0392b;background:rgba(224,69,63,.06);}
.w-preview{margin-top:10px;padding:12px;background:#faf8ff;border-radius:8px;font-size:.78rem;color:rgba(45,36,56,.6);line-height:1.7;max-height:200px;overflow-y:auto;white-space:pre-wrap;font-family:'Noto Serif KR',serif;display:none;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(184,134,42,.25);border-radius:2px;}
.fade-in{animation:fadeIn .35s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;padding:10px 18px;border-radius:10px;font-size:.82rem;background:rgba(82,194,122,0.95);color:#fff;display:none;pointer-events:none;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:580px){.row2{grid-template-columns:1fr;}}

/* ══ 교사 구글 로그인 / 학생 반모둠 입장 / 대시보드 추가 스타일 ══ */
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#3c4043;border:1px solid rgba(45,36,56,.15);border-radius:12px;font-weight:700;font-size:.95rem;padding:14px;width:100%;cursor:pointer;font-family:inherit;}
.google-icon{width:20px;height:20px;flex-shrink:0;}
.teacher-chip{display:flex;align-items:center;gap:8px;background:#faf8ff;border:1px solid rgba(124,58,237,.08);border-radius:10px;padding:8px 12px;margin-bottom:16px;text-align:left;}
.teacher-avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;}
.invite-box{background:#faf8ff;border:1px solid rgba(124,58,237,.12);border-radius:10px;padding:12px;font-size:.7rem;color:rgba(45,36,56,.6);word-break:break-all;font-family:monospace;margin-top:8px;text-align:left;}
.invite-qr-box{background:#fff;border:1px solid rgba(124,58,237,.1);border-radius:10px;padding:14px;display:inline-block;margin-top:12px;text-align:center;}
.invite-qr-caption{font-size:.62rem;color:rgba(45,36,56,.4);margin-top:6px;letter-spacing:.05em;}
.locked-notice{background:rgba(224,69,63,0.06);border:1.5px solid rgba(224,69,63,0.25);border-radius:10px;padding:14px;text-align:center;margin-bottom:14px;font-size:.82rem;color:#c0392b;}
.no-teacher-wrap,.loading-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--sub);}
.group-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(124,58,237,.08);font-size:.82rem;color:rgba(45,36,56,.7);text-align:left;}
.group-del{background:none;border:none;color:#c0392b;cursor:pointer;font-size:.75rem;}
.hub-link{font-size:.7rem;color:rgba(45,36,56,.4);text-decoration:none;padding:4px 8px;border:1px solid rgba(124,58,237,.12);border-radius:6px;}
.group-invite-overlay{position:fixed;inset:0;background:rgba(45,36,56,.35);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;}
.group-invite-box{background:#fff;border:1px solid rgba(124,58,237,.15);border-radius:16px;padding:28px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(45,36,56,.15);}
.group-invite-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--gold);margin-bottom:14px;font-weight:700;}
.group-lock-badge{font-size:.72rem;color:#2e7d4f;background:rgba(82,194,122,0.08);border:1px solid rgba(82,194,122,.25);border-radius:8px;padding:8px 10px;margin-bottom:10px;text-align:left;}

/* ══ 전문가 과정 ══ */
.mode-tabs{display:flex;background:rgba(124,58,237,0.04);border-radius:12px;padding:5px;margin-bottom:18px;gap:5px;}
.mode-tab{flex:1;padding:12px 8px;border-radius:8px;cursor:pointer;text-align:center;border:none;font-family:inherit;background:none;color:var(--sub);transition:all .2s;}
.mode-tab .mt-title{font-size:.88rem;font-weight:700;}
.mode-tab .mt-sub{font-size:.62rem;margin-top:2px;opacity:.7;}
.mode-tab.on{background:rgba(184,134,42,0.15);color:var(--gold);}
.mode-tab.on.expert{background:rgba(124,58,237,0.1);color:#a83fb0;}
.expert-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.3);color:#a83fb0;border-radius:20px;padding:3px 12px;font-size:.68rem;font-weight:700;letter-spacing:.05em;}
.expert-fields{background:rgba(124,58,237,0.04);border:1px solid rgba(124,58,237,0.12);border-radius:12px;padding:16px;margin-bottom:16px;}
</style>
</head>
<body>

<div class="loading-wrap" id="loadingOverlay">✦ 불러오는 중...</div>

<div class="no-teacher-wrap" id="noTeacherOverlay" style="display:none">
  <div>
    <div style="font-size:1.6rem;margin-bottom:10px">🔗</div>
    <div style="font-size:.95rem;margin-bottom:8px">선생님께 받은 초대 링크로 접속해주세요</div>
    <div style="font-size:.75rem;color:var(--sub)">이 링크에는 우리 반 정보가 담겨 있어요</div>
  </div>
</div>

<div id="teacherGoogleOverlay" class="login-wrap" style="display:none">
  <div class="login-box">
    <div class="login-logo">🎭 EAIM 음악미디어</div>
    <div class="login-sub">교사 로그인</div>
    <div class="err-msg" id="googleLoginErr" style="text-align:center"></div>
    <button class="google-btn" onclick="googleLogin()">

<script>
'use strict';
const LS = {
  get:(k,d=null)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};
const DRAFT_KEY='mm_draft';

// ══════════════════════════
// 🔥 Firebase — teachers/{uid}/... 구조 (국어·과학 놀이터와 같은 프로젝트)
// (API 키 오타 수정: BaLg → Balg)
// ══════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBalg0f5x0ydfHxn_nzgZ1pAELvJw6PzoY",
  authDomain: "eaim-classroom.firebaseapp.com",
  projectId: "eaim-classroom",
  storageBucket: "eaim-classroom.firebasestorage.app",
  messagingSenderId: "294479576192",
  appId: "1:294479576192:web:c60e994e319dbd2f11ba65"
};
let db=null, auth=null, firebaseReady=false;
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore(); auth=firebase.auth(); firebaseReady=true;
}catch(e){ console.error('Firebase 초기화 실패', e); firebaseReady=false; }

const teacherDocRef  = (uid) => db.collection('teachers').doc(uid);
const settingsDocRef = (uid) => teacherDocRef(uid).collection('meta').doc('settings');
const groupsColRef   = (uid) => teacherDocRef(uid).collection('groups');
const worksColRef    = (uid) => teacherDocRef(uid).collection('works');

let currentUser=null, teacherUid=null, isStudentMode=false;
let stuName='', stuClass='', lockedGroupParam='';
let settings = { apiKey:'', classOn:false, sheetUrl:'' };
let groups=[], works=[];
let dashTab='settings';
let unsubSettings=null, unsubGroups=null, unsubWorks=null;

function subscribeSettings(uid, cb){
  if(unsubSettings) unsubSettings();
  unsubSettings = settingsDocRef(uid).onSnapshot(snap=>{
    settings = snap.exists ? {apiKey:'', classOn:false, sheetUrl:'', ...snap.data()} : {apiKey:'', classOn:false, sheetUrl:''};
    cb && cb();
  }, err=>{ console.warn('설정 동기화 오류', err); cb && cb(); });
}
function setSettings(uid, fields){
  settings = {...settings, ...fields};
  settingsDocRef(uid).set(fields,{merge:true}).catch(e=>showToast('❌ 저장 실패: '+e.message));
}
async function addGroup(name){
  try{ await groupsColRef(teacherUid).add({name, createdAt: firebase.firestore.FieldValue.serverTimestamp()}); }
  catch(e){ showToast('❌ 저장 실패: '+e.message); }
}
async function deleteGroupFn(id){
  try{ await groupsColRef(teacherUid).doc(id).delete(); }
  catch(e){ showToast('❌ 삭제 실패: '+e.message); }
}
function subscribeGroups(uid){
  if(unsubGroups) unsubGroups();
  unsubGroups = groupsColRef(uid).orderBy('createdAt','asc').onSnapshot(snap=>{
    groups = snap.docs.map(d=>({id:d.id, name:d.data().name}));
    if(isStudentMode) populateClassSelect();
    else if(dashTab==='settings') renderDashContent();
  }, err=>console.warn('그룹 동기화 오류', err));
}
function populateClassSelect(){
  const sel=document.getElementById('sclass'); if(!sel) return;
  sel.innerHTML='<option value="">반/모둠 선택</option>';
  if(!groups.length){
    const opt=document.createElement('option'); opt.disabled=true; opt.textContent='(선생님이 아직 반/모둠을 만들지 않았어요)';
    sel.appendChild(opt);
  } else {
    groups.forEach(g=>{ const opt=document.createElement('option'); opt.value=g.name; opt.textContent=g.name; sel.appendChild(opt); });
  }
  const badge=document.getElementById('group-lock-badge');
  if(lockedGroupParam && groups.some(g=>g.name===lockedGroupParam)){
    sel.value=lockedGroupParam; sel.disabled=true;
    if(badge){ badge.style.display='block'; badge.textContent=`🔒 "${lockedGroupParam}" 전용 링크로 접속했어요`; }
  } else {
    sel.disabled=false;
    if(badge) badge.style.display='none';
  }
}
async function addGroupUI(){
  const input=document.getElementById('newGroupName');
  const name=input.value.trim();
  if(!name){ alert('반/모둠 이름을 입력하세요!'); return; }
  await addGroup(name); input.value='';
}
async function bulkAddGroups(){
  const gradeEl=document.getElementById('bulkGrade'), countEl=document.getElementById('bulkCount'), groupCountEl=document.getElementById('bulkGroupCount');
  const grade=gradeEl.value.trim();
  const count=parseInt(countEl.value,10);
  const groupCount=parseInt(groupCountEl.value,10);
  if(!grade){ alert('학년을 입력하세요! (예: 1학년)'); return; }
  if(!count || count<1){ alert('반 수를 1 이상으로 입력하세요!'); return; }
  if(count>20){ alert('반 수는 한 번에 최대 20개까지 만들 수 있어요!'); return; }
  const hasGroups = !!groupCount && groupCount>=1;
  if(hasGroups && groupCount>20){ alert('모둠 수는 반당 최대 20개까지 만들 수 있어요!'); return; }
  const totalCount = hasGroups ? count*groupCount : count;
  if(totalCount>80){ alert('한 번에 최대 80개까지만 만들 수 있어요. 반 수 또는 모둠 수를 줄여주세요!'); return; }
  const existing=new Set(groups.map(g=>g.name));
  const toAdd=[];
  for(let i=1;i<=count;i++){
    if(hasGroups){
      for(let j=1;j<=groupCount;j++){
        const name=`${grade} ${i}반 ${j}모둠`;
        if(!existing.has(name)) toAdd.push(name);
      }
    } else {
      const name=`${grade} ${i}반`;
      if(!existing.has(name)) toAdd.push(name);
    }
  }
  if(!toAdd.length){ showToast('이미 모두 만들어져 있어요'); return; }
  try{
    const batch=db.batch();
    toAdd.forEach(name=>{
      const ref=groupsColRef(teacherUid).doc();
      batch.set(ref,{name, createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    });
    await batch.commit();
    gradeEl.value=''; countEl.value=''; groupCountEl.value='';
    showToast(`✅ ${toAdd.length}개 반/모둠 생성 완료!`);
  }catch(e){ showToast('❌ 일괄 생성 실패: '+e.message); }
}
async function deleteGroupUI(id){
  if(!confirm('이 반/모둠을 삭제할까요?')) return;
  await deleteGroupFn(id);
}

function subscribeWorks(uid){
  if(unsubWorks) unsubWorks();
  unsubWorks = worksColRef(uid).orderBy('createdAt','desc').onSnapshot(snap=>{
    works = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const badge=document.getElementById('worksCountBadge');
    if(badge){ badge.style.display=works.length?'inline-block':'none'; badge.textContent=works.length; }
    if(dashTab==='works') renderDashContent();
  }, err=>console.warn('결과물 동기화 오류', err));
}

function hideAllOverlays(){
  ['loadingOverlay','noTeacherOverlay','teacherGoogleOverlay','studentLoginOverlay'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.style.display='none';
  });
  document.getElementById('teacherPanel').style.display='none';
  document.getElementById('root').style.display='none';
}
function renderNoTeacherLink(){ hideAllOverlays(); document.getElementById('noTeacherOverlay').style.display='flex'; }
function renderTeacherGoogleGate(err){
  hideAllOverlays();
  document.getElementById('teacherGoogleOverlay').style.display='flex';
  document.getElementById('googleLoginErr').textContent = err||'';
}
function renderStudentLoginGate(){
  hideAllOverlays();
  document.getElementById('studentLoginOverlay').style.display='flex';
  document.getElementById('lockedNotice').style.display = settings.classOn? 'none':'block';
  document.getElementById('sNBtn').disabled = !settings.classOn;
  populateClassSelect();
}
function enterTeacherDashboard(){
  hideAllOverlays();
  document.getElementById('teacherPanel').style.display='block';
  subscribeGroups(teacherUid);
  subscribeWorks(teacherUid);
  renderDashContent();
}
function enterStudentApp(){
  hideAllOverlays();
  document.getElementById('root').style.display='block';
  renderStudent();
}

function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e=>{ document.getElementById('googleLoginErr').textContent='로그인 실패: '+e.message; });
}
function teacherLogout(){
  if(unsubSettings){unsubSettings();unsubSettings=null;}
  if(unsubGroups){unsubGroups();unsubGroups=null;}
  if(unsubWorks){unsubWorks();unsubWorks=null;}
  auth.signOut(); teacherUid=null;
  renderTeacherGoogleGate();
}
function studentLogout(){
  if(unsubSettings){unsubSettings();unsubSettings=null;}
  if(unsubGroups){unsubGroups();unsubGroups=null;}
  stuName=''; stuClass='';
  renderStudentLoginGate();
}
function sN(){
  const n=document.getElementById('sni').value.trim();
  const c=document.getElementById('sclass').value;
  const err=document.getElementById('login-err');
  if(!settings.classOn){ err.textContent='선생님이 아직 수업을 열지 않았어요'; return; }
  if(!n){ err.textContent='이름을 입력해주세요'; return; }
  if(!c){ err.textContent='반/모둠을 선택해주세요'; return; }
  err.textContent='';
  stuName=n; stuClass=c;
  enterStudentApp();
}

function setDashTab(tab){
  dashTab=tab;
  document.getElementById('dashTabSettings').classList.toggle('on', tab==='settings');
  document.getElementById('dashTabWorks').classList.toggle('on', tab==='works');
  renderDashContent();
}

function renderDashContent(){
  const el=document.getElementById('dash-content'); if(!el) return;
  if(dashTab==='settings'){
    const inviteUrl = `${location.origin}${location.pathname}?role=student&teacher=${teacherUid||''}`;
    el.innerHTML=`
    <div class="teacher-chip">
      <img class="teacher-avatar" src="${currentUser?.photoURL||''}" onerror="this.style.display='none'">
      <div style="font-size:.8rem">${currentUser?.displayName||''} · ${currentUser?.email||''}</div>
    </div>
    <div class="card"><div class="card-title">🎓 수업 상태</div>
      <div class="toggle-row"><div><div style="font-weight:700;font-size:.95rem">${settings.classOn?'수업 진행 중':'수업 종료'}</div>
        <div style="font-size:.72rem;color:var(--sub);margin-top:3px">${settings.classOn?'학생들이 접속할 수 있어요':'학생 접속이 차단됩니다'}</div></div>
        <div class="toggle-track ${settings.classOn?'on':''}" onclick="toggleClass()"><div class="toggle-thumb"></div></div>
      </div>
      <div style="font-size:.7rem;color:var(--sub);margin-top:12px;letter-spacing:.1em;text-transform:uppercase">학생 초대 링크</div>
      <div class="invite-box">${inviteUrl}</div>
      <button class="btn-sec" style="margin-top:8px;padding:7px 14px;font-size:.78rem" onclick="copyInvite('${inviteUrl}')">🔗 링크 복사</button>
      <div><div class="invite-qr-box" id="inviteQr"></div>
        <div class="invite-qr-caption">📱 학생들이 이 QR을 스캔하면 바로 접속돼요</div>
      </div>
    </div>
    <div class="card"><div class="card-title">🏷️ 반/모둠 이름 관리</div>
      <div style="font-size:.7rem;color:var(--sub);letter-spacing:.05em;margin-bottom:6px">📦 일괄 생성</div>
      <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap">
        <input type="text" class="t-input" id="bulkGrade" placeholder="학년 (예: 1학년)" style="flex:1;min-width:100px;margin-bottom:0">
        <input type="number" class="t-input" id="bulkCount" placeholder="반 수" min="1" max="20" style="width:80px;margin-bottom:0">
        <input type="number" class="t-input" id="bulkGroupCount" placeholder="모둠 수(선택)" min="1" max="20" style="width:110px;margin-bottom:0">
        <button class="main-btn" style="width:auto;padding:0 16px" onclick="bulkAddGroups()">생성</button>
      </div>
      <div style="font-size:.68rem;color:var(--sub);margin-bottom:14px">
        모둠 수를 비워두면 "1학년 1반~N반"만 생성돼요.<br>
        모둠 수를 넣으면(예: 반 수 3 + 모둠 수 4) "1학년 1반 1모둠"~"1학년 3반 4모둠"까지 한 번에 생성돼요.
      </div>
      <div style="font-size:.7rem;color:var(--sub);letter-spacing:.05em;margin-bottom:6px">✏️ 하나씩 추가</div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <input type="text" class="t-input" id="newGroupName" placeholder="예: 3반 뮤지컬반" style="flex:1;margin-bottom:0">
        <button class="main-btn" style="width:auto;padding:0 18px" onclick="addGroupUI()">추가</button>
      </div>
      <div id="groupListDash">
        ${groups.length? groups.map(g=>`<div class="group-item"><span>${g.name}</span><div style="display:flex;gap:6px;align-items:center"><button class="w-btn" data-gname="${escapeAttr(g.name)}" onclick="showGroupInvite(this.dataset.gname)">🔗 QR</button><button class="group-del" onclick="deleteGroupUI('${g.id}')">삭제</button></div></div>`).join('')
                       : '<p style="font-size:.8rem;color:var(--sub)">아직 만든 반/모둠이 없어요</p>'}
      </div>
    </div>
    <div class="card"><div class="card-title">🔑 Gemini API 키</div>
      <input class="t-input" type="password" id="api-input" value="${settings.apiKey||''}" placeholder="AIza... (학생에게 노출되지 않아요)" oninput="saveApi(this.value)">
      ${settings.apiKey?`<div style="display:flex;align-items:center;gap:6px;font-size:.72rem;color:#86efac;margin-top:4px"><div class="api-dot dot-on"></div>API 키 저장됨</div>`:''}
    </div>
    <div class="card"><div class="card-title">📊 구글시트 연동</div>
      <p style="font-size:.75rem;color:var(--sub);line-height:1.7;margin-bottom:10px">학생이 뮤지컬을 완성할 때마다 아래 구글시트 웹앱 URL로 자동 기록돼요. (선택 사항 — 비워두면 시트 연동 없이도 정상 작동합니다)</p>
      <input class="t-input" type="text" id="sheet-url-input" value="${settings.sheetUrl||''}" placeholder="https://script.google.com/macros/s/.../exec" oninput="saveSheetUrl(this.value)">
      ${settings.sheetUrl?`<div style="display:flex;align-items:center;gap:6px;font-size:.72rem;color:#86efac;margin-top:4px"><div class="api-dot dot-on"></div>연동됨</div>`:''}
      <button class="btn-sec" style="margin-top:8px;padding:7px 14px;font-size:.78rem" onclick="testSheetConnection()">🔗 연결 테스트</button>

    el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:.75rem;color:var(--sub)">총 ${works.length}개의 결과물</div>
      ${works.length?`<button class="w-btn danger" onclick="clearAllWorks()">전체 삭제</button>`:''}
    </div>
    ${works.length===0?`<div style="text-align:center;padding:50px 20px;color:rgba(255,255,255,.2)">아직 학생 결과물이 없어요 🎭</div>`:
      works.map(w=>`<div class="work-card ${w.approved?'approved':''}" id="wc-${w.id}">
        <div style="display:flex;align-items:flex-start;gap:8px">
          <div style="width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0;background:${w.approved?'var(--green)':'var(--gold)'};box-shadow:0 0 5px ${w.approved?'var(--green)':'var(--gold)'}"></div>
          <div style="flex:1;min-width:0"><div class="w-title">${w.expertMode?'🎓 ':''}${w.title||'(제목없음)'}</div>
          <div class="w-meta">${w.student} · ${w.group||''} · ${w.genre} · ${w.acts}막 · ${w.cast}명 · ${w.time}${w.expertMode&&w.conflictType?` · ${w.conflictType}`:''}</div></div>
        </div>
        <div class="w-actions">
          <button class="w-btn" onclick="toggleWPreview('${w.id}')">👁 미리보기</button>

          <button class="w-btn" onclick="downloadWork('${w.id}')">📥 다운로드</button>
          <button class="w-btn danger" onclick="deleteWork('${w.id}')">삭제</button>
        </div>
        <div class="w-preview" id="wp-${w.id}">${w.preview||''}</div>
      </div>`).join('')}`;
  }
}

  showToast('🔄 연결 확인 중...');

  const a=document.createElement('a');

  a.download=`${w.title||'뮤지컬'}_${w.student}.txt`;a.click();
}

async function callGemini(prompt, retryCount, maxTokens){
  retryCount = retryCount || 0;
  maxTokens = maxTokens || 8192;
  const key=settings.apiKey||'';
  if(!key)throw new Error('API 키가 설정되지 않았어요. 선생님께 문의하세요.');
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${key.trim()}`;
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.9,maxOutputTokens:maxTokens}})});
  if(!res.ok){
    const e=await res.json().catch(()=>({}));
    const msg=e?.error?.message||`오류 ${res.status}`;
    const isBusy = res.status===429 || res.status===503 || /high demand|overloaded|unavailable/i.test(msg);
    if(isBusy && retryCount<3){
      const waitMs=1500*(retryCount+1);
      showToast(`⏳ 서버가 혼잡해요, ${Math.round(waitMs/1000)}초 후 자동 재시도... (${retryCount+1}/3)`);
      await new Promise(r=>setTimeout(r,waitMs));
      return callGemini(prompt, retryCount+1, maxTokens);
    }
    throw new Error(msg);
  }
  const data=await res.json();return data.candidates?.[0]?.content?.parts?.[0]?.text||'';
}

function chunkArray(arr,size){const out=[];for(let i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));return out;}

    const struct=parseJSON(s1),charsStr=struct.characters.join(', ');

    const scriptFieldSpec = expertMode
      ? `"script":"이 막의 정식 대본. 인물명: 대사 형식과 (지문)을 섞어 ${lenSpec} 내외로 작성. 그 막의 극적 기능·목표·장애물이 뚜렷하게 드러나야 함", `

      const sn=await callGemini(`뮤지컬 "${struct.title}"의 다음 막(들) 장면을 작성하세요.
${actsBrief}
인물:${charsStr}${expertMode?` | 갈등:${conflictType} | 톤:${toneVal||'자유'}`:''}
각 막마다 아래 형식의 객체를 만들어, 정확히 ${group.length}개짜리 JSON 배열로만 응답하세요(다른 설명 없이, 막 순서대로):
[{"sceneTitle":"막 제목(위 개요의 제목 사용)","songTitle":"넘버제목","singer":"이 넘버를 부르는 인물(들). 예: '민준 솔로', '민준·서아 듀엣', '전체 합창'","lyrics":"가사 4-6줄","characters":"등장인물","sunoPrompt":"영문 Suno(50단어이내)","bgPrompt":"영문 배경이미지, 2.5D parallax composition with distinct far background layer(sky/distant scenery), mid layer(buildings/trees/environment), near foreground layer(props/ground details), theatrical stage lighting, --ar 16:9","emotion":"감정","mood":"분위기 한국어", ${scriptFieldSpec}}]`, 0, 16384);
      const parsed=parseJSON(sn);
      scenes.push(...(Array.isArray(parsed)?parsed:[parsed]));
    }
    setStep(4,'커튼콜 작성 중...');
    const s4=await callGemini(`뮤지컬 "${struct.title}" 커튼콜.
오프닝가사:${opening.lyrics} | 줄거리:${struct.synopsis}
JSON만:{"songTitle":"커튼콜 제목(Reprise가능)","singer":"이 넘버를 부르는 인물(들). 보통 '전체 합창'","lyrics":"가사 4-6줄(감동적 마무리)","sunoPrompt":"영문 Suno(emotional finale,50단어이내)","bgPrompt":"영문 배경이미지(grand finale, all cast), 2.5D parallax composition with distinct far background layer(sky/distant scenery), mid layer(buildings/trees/environment), near foreground layer(props/ground details), theatrical stage lighting, --ar 16:9","mood":"분위기 한국어"}`);
    const curtain=parseJSON(s4);
    setStep(5,'완성 정리 중...');
    generatedData={performanceType:'general',title:struct.title,genre,characters:struct.characters,synopsis:struct.synopsis,setting,opening,scenes,curtain,expertMode,conflictType,toneStyle:toneVal,scriptLength,interviewText:'',reflectionText:''};
    LS.set(DRAFT_KEY,generatedData);saveWork(generatedData);

let currentWorkId = null;
function saveWork(d){
  const fullText = d.performanceType==='reading' ? buildReadingFullText(d) : buildFullText(d);
  const newId = worksColRef(teacherUid).doc().id;
  currentWorkId = newId;
  const workAects = d.performanceType==='reading' ? (d.scenes||[]).length : actCount;
  const workCast = d.performanceType==='reading' ? (d.characters||[]).length : castCount;
  const preview = d.performanceType==='reading'
    ? `${d.performanceStructure||''}\n\n♪ ${d.song?.songTitle||''}\n${d.song?.lyrics||''}`
    : `${d.synopsis}\n\n♪ ${d.opening.songTitle}\n${d.opening.lyrics}`;
  const work={student:stuName||'익명',group:stuClass||'',title:d.title,genre:d.genre,acts:workAects,cast:workCast,
    performanceType:d.performanceType||'general',
    expertMode:!!d.expertMode,conflictType:d.conflictType||'',scriptLength:d.scriptLength||scriptLength||'',
    interviewText:d.interviewText||'',reflectionText:d.reflectionText||'',
    time:new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),
    approved:false,preview,fullText,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  worksColRef(teacherUid).doc(newId).set(work).catch(e=>showToast('❌ 결과물 저장 실패: '+e.message));

  // 구글시트로도 전송 (선택 사항 — URL 없으면 조용히 건너뜀)
  if(settings.sheetUrl){
    fetch(settings.sheetUrl,{
      method:'POST',
      body:JSON.stringify({
        action:'logWork',
        student: stuName||'익명',
        group: stuClass||'',
        title: d.title,
        genre: d.genre,
        acts: workAects,
        cast: workCast,
        expertMode: !!d.expertMode,
        conflictType: d.conflictType||'',
        synopsis: d.synopsis||d.performanceStructure||''
      })
    }).catch(()=>{}); // 실패해도 앱 사용에 지장 없도록 조용히 무시
  }
}

function buildFullText(d){
  if(!d)return'';
  let t=`${'═'.repeat(48)}\n  ${(d.title||'').toUpperCase()}\n  ${d.genre}${d.expertMode?'  [전문가 과정]':''}\n${'═'.repeat(48)}\n\n`;
  t+=`📖 줄거리\n${d.synopsis}\n\n👥 등장인물\n  ${(d.characters||[]).join('\n  ')}\n\n`;
  if(d.expertMode && d.conflictType) t+=`🎭 중심 갈등: ${d.conflictType}${d.toneStyle?` · 톤: ${d.toneStyle}`:''}\n\n`;
  t+=`【 오프닝 코러스 】\n${'─'.repeat(36)}\n♪ ${d.opening.songTitle}${d.opening.singer?` (${d.opening.singer})`:''}\n\n${d.opening.lyrics}\n\n[Suno] ${d.opening.sunoPrompt}\n[BG] ${d.opening.bgPrompt}\n\n`;
  (d.scenes||[]).forEach((s,i)=>{
    t+=`【 ${i+1}막: ${s.sceneTitle} 】\n${'─'.repeat(36)}\n등장: ${s.characters}\n`;
    if(s.script) t+=`\n[대본]\n${s.script}\n`;
    t+=`\n♪ ${s.songTitle}${s.singer?` (${s.singer})`:''}\n\n${s.lyrics}\n\n[Suno] ${s.sunoPrompt}\n[BG] ${s.bgPrompt}\n\n`;
  });
  t+=`【 커튼콜 】\n${'─'.repeat(36)}\n♪ ${d.curtain.songTitle}${d.curtain.singer?` (${d.curtain.singer})`:''}\n\n${d.curtain.lyrics}\n\n[Suno] ${d.curtain.sunoPrompt}\n[BG] ${d.curtain.bgPrompt}`;
  if(d.interviewText) t+=`\n\n【 인터뷰글 】\n${'─'.repeat(36)}\n${d.interviewText}`;
  if(d.reflectionText) t+=`\n\n【 음악 감상문 】\n${'─'.repeat(36)}\n${d.reflectionText}`;
  return t;
}

function buildReadingFullText(d){
  if(!d)return'';
  let t=`${'═'.repeat(48)}\n  ${(d.title||'').toUpperCase()}\n  [음악낭독극] ${d.genre||''}\n${'═'.repeat(48)}\n\n`;
  t+=`📋 공연 구성: ${d.performanceStructure||''}\n🎒 준비물: ${d.preparation||''}\n\n`;
  t+=`👥 배역\n`+(d.characters||[]).map((c,i)=>`  • ${c.role}${d.roleNames?.[i]?` (${d.roleNames[i]})`:''} — ${c.desc||''} / 표현: ${c.tip||''}`).join('\n')+`\n\n`;
  (d.scenes||[]).forEach((s,i)=>{
    t+=`【 장면 ${i+1}: ${s.sceneTitle||''} 】 ${s.timeEstimate||''}\n${'─'.repeat(36)}\n${s.script||''}\n`;
    const note=d.expressionNotes?.[i];
    if(note) t+=`\n표현 메모 — 낱말:${note.word||''} / 시선·동작:${note.motion||''} / 배경음악 시작:${note.bgm||''}\n`;
    t+=`\n`;
  });
  t+=`【 노래: ${d.song?.songTitle||''} 】\n${'─'.repeat(36)}\n`;
  (d.song?.sections||[]).forEach(sec=>{ t+=`${sec.part} (${sec.time})\n`; });
  t+=`\n${d.song?.lyrics||''}\n\n[Suno] ${d.song?.sunoPrompt||''}\n[BG] ${d.song?.bgPrompt||''}\n\n`;
  t+=`🚶 무대 동선\n  노래 시작 위치: ${d.blocking?.start||''}\n  합창으로 모이는 시점: ${d.blocking?.gather||''}\n  상징적 소품·동작 사용 시점: ${d.blocking?.prop||''}\n  마지막 자세와 시선: ${d.blocking?.final||''}\n\n`;
  if(d.interviewText) t+=`【 인터뷰글 】\n${'─'.repeat(36)}\n${d.interviewText}\n\n`;
  if(d.reflectionText) t+=`【 성찰 】\n${'─'.repeat(36)}\n${d.reflectionText}`;
  return t;
}

function scheduleAutoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>{
    collectEdits();LS.set(DRAFT_KEY,generatedData);
    if(currentWorkId){
      const fullText = generatedData.performanceType==='reading' ? buildReadingFullText(generatedData) : buildFullText(generatedData);
      const preview = generatedData.performanceType==='reading'
        ? `${generatedData.performanceStructure||''}\n\n♪ ${generatedData.song?.songTitle||''}\n${generatedData.song?.lyrics||''}`
        : `${generatedData.synopsis}\n\n♪ ${generatedData.opening.songTitle}\n${generatedData.opening.lyrics}`;
      worksColRef(teacherUid).doc(currentWorkId).set({fullText, preview, interviewText:generatedData.interviewText||'', reflectionText:generatedData.reflectionText||''},{merge:true})
        .catch(e=>console.warn('자동저장 실패', e));
    }
    showToast('💾 자동저장 완료');
  },1500);
}

function collectEdits(){
  if(!generatedData)return;
  const getVal=id=>document.getElementById(id)?.value||'';
  if(generatedData.performanceType==='reading'){
    (generatedData.characters||[]).forEach((_,i)=>{ generatedData.roleNames[i]=getVal(`role-name-${i}`); });
    (generatedData.scenes||[]).forEach((_,i)=>{
      generatedData.scenes[i].script=getVal(`rscript-${i}`);
      generatedData.expressionNotes[i]={word:getVal(`exp-word-${i}`),motion:getVal(`exp-motion-${i}`),bgm:getVal(`exp-bgm-${i}`)};
    });
    if(generatedData.song){
      generatedData.song.lyrics=getVal('rsong-lyrics');
      generatedData.song.sunoPrompt=getVal('rsong-suno');
      generatedData.song.bgPrompt=getVal('rsong-bg');
    }
    generatedData.blocking={start:getVal('block-start'),gather:getVal('block-gather'),prop:getVal('block-prop'),final:getVal('block-final')};
    generatedData.checklistPre=(generatedData.checklistPre||[]).map((_,i)=>document.getElementById(`check-pre-${i}`)?.checked||false);
    generatedData.checklistPost=(generatedData.checklistPost||[]).map((_,i)=>document.getElementById(`check-post-${i}`)?.checked||false);
    generatedData.interviewText=getVal('interview-text');
    generatedData.reflectionText=getVal('reflection-text');
    return;
  }
  generatedData.opening.lyrics=getVal('lyrics-opening');generatedData.opening.sunoPrompt=getVal('suno-opening');generatedData.opening.bgPrompt=getVal('bg-opening');generatedData.opening.singer=getVal('singer-opening');
  (generatedData.scenes||[]).forEach((_,i)=>{
    generatedData.scenes[i].lyrics=getVal(`lyrics-scene-${i}`);generatedData.scenes[i].sunoPrompt=getVal(`suno-scene-${i}`);generatedData.scenes[i].bgPrompt=getVal(`bg-scene-${i}`);generatedData.scenes[i].singer=getVal(`singer-scene-${i}`);
    if(generatedData.scenes[i].script!==undefined) generatedData.scenes[i].script=getVal(`script-scene-${i}`);
  });
  generatedData.curtain.lyrics=getVal('lyrics-curtain');generatedData.curtain.sunoPrompt=getVal('suno-curtain');generatedData.curtain.bgPrompt=getVal('bg-curtain');generatedData.curtain.singer=getVal('singer-curtain');
  generatedData.interviewText=getVal('interview-text');
  generatedData.reflectionText=getVal('reflection-text');
}

function downloadAll(){
  collectEdits();
  const text = generatedData.performanceType==='reading' ? buildReadingFullText(generatedData) : buildFullText(generatedData);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
  a.download=`${generatedData?.title||'뮤지컬'}_${stuName||'학생'}.txt`;a.click();
}

async function downloadDocx(){
  if (typeof docx === 'undefined') { showToast('⚠️ Word 변환 도구를 불러오지 못했어요. 인터넷 연결을 확인해주세요'); return; }
  collectEdits();
  const text = generatedData.performanceType==='reading' ? buildReadingFullText(generatedData) : buildFullText(generatedData);
  showToast('📄 Word 파일 만드는 중...');
  try{
    const lines = text.split('\n');
    const children = [
      new docx.Paragraph({ text: generatedData?.title || '뮤지컬', heading: docx.HeadingLevel.TITLE, spacing:{after:300} })
    ];
    lines.forEach(line=>{
      const trimmed = line.trim();
      if(/^[═─]+$/.test(trimmed)) return; // 장식용 구분선은 워드 문서에선 생략
      if(!trimmed){ children.push(new docx.Paragraph({ text:'' })); return; }
      if(trimmed.startsWith('【')){
        children.push(new docx.Paragraph({ text: trimmed, heading: docx.HeadingLevel.HEADING_2, spacing:{before:280,after:120} }));
        return;
      }
      children.push(new docx.Paragraph({ children:[ new docx.TextRun({ text: line }) ], spacing:{after:80} }));
    });
    const doc = new docx.Document({ sections:[{ properties:{}, children }] });
    const blob = await docx.Packer.toBlob(doc);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${generatedData?.title||'뮤지컬'}_${stuName||'학생'}.docx`;
    a.click();
    showToast('✅ Word 파일 다운로드 완료!');
  }catch(e){
    console.error(e);
    showToast('❌ Word 변환 실패: '+e.message);
  }
}

function copyEl(id){const el=document.getElementById(id);if(!el)return;navigator.clipboard.writeText(el.value||el.textContent).then(()=>showToast('✅ 복사됨!'));}
async function genInterviewQuestions(){
  if(!generatedData){ showToast('⚠️ 먼저 뮤지컬을 완성해주세요'); return; }
  const ta=document.getElementById('interview-text'); if(!ta) return;
  showToast('✨ 질문을 만들고 있어요...');
  try{
    const prompt=`뮤지컬 "${generatedData.title}" (장르: ${generatedData.genre})의 줄거리: ${generatedData.synopsis}
이 작품을 만든 학생 작가와의 인터뷰 질문을 3~4개 만들어주세요. 창작 의도, 표현하고 싶었던 감정, 인상 깊은 장면, 등장인물 설정 이유 등을 물어보는 질문으로, 중학생이 답하기 좋은 눈높이로 작성하세요.
다른 설명 없이, 각 줄에 "Q. 질문" 형식으로만 응답하세요.`;
    const text=await callGemini(prompt);
    const questions=text.trim().split('\n').map(l=>l.trim()).filter(l=>l.startsWith('Q'));
    const template=questions.map(q=>`${q}\nA. `).join('\n\n');
    ta.value=ta.value.trim() ? ta.value+'\n\n'+template : template;
    scheduleAutoSave();
    showToast('✅ 질문이 추가됐어요! 답을 적어보세요');
  }catch(e){
    showToast('❌ 질문 생성 실패: '+e.message);
  }
}
let toastT;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{el.style.display='none';},2000);}
